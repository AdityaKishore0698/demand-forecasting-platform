# Central configuration for the forecasting pipeline.
# Everything that changes model behaviour lives here so runs are reproducible.
# Paths are relative to the repository root.

seed: 42

paths:
  raw_dir: data/raw
  artifact_dir: artifacts

data:
  train_file: orders_train.csv
  test_file: orders_test.csv          # future calendar/schedule only (no target)
  hub_metadata_file: hub_metadata.csv
  label: user-supplied                # provenance tag stored with the artifacts

forecast:
  horizon_days: 42          # model predicts 1..42 days ahead of the last known day
  origin_stride_days: 7     # spacing between training "forecast origins" (see docs/ARCHITECTURE.md)
  min_history_days: 28      # an origin needs >= 28 days of history (longest rolling window is 42, min_periods = w // 2)

features:
  lag_days: [1, 7, 14, 21, 28, 35, 42]
  rolling_windows: [7, 14, 28, 42]
  schedule_shifts: [-1, 1]  # tomorrow / yesterday's known schedule flags

validation:
  n_windows: 3              # window 0 is the headline hold-out; the others are earlier robustness checks

model:
  type: boosting_ensemble   # final model: LightGBM + CatBoost + XGBoost. Set to lightgbm_single for the rollback path.
  ensemble:
    # Archived final recipes (verified identical to experiments/ensemble_corrected/recipes.py by a test). Not tuned here.
    weights: {lightgbm: 0.6, catboost: 0.1, xgboost: 0.3}
    catboost_params:        # target log1p(demand), prediction expm1
      loss_function: RMSE
      eval_metric: RMSE
      iterations: 1320      # 1,199 best iteration + ~10% margin
      learning_rate: 0.08
      depth: 6
      l2_leaf_reg: 3.0
      boosting_type: Plain
      bootstrap_type: Bernoulli
      subsample: 0.8
      thread_count: -1
      verbose: 0
    xgboost_params:
      objective: "reg:tweedie"
      tweedie_variance_power: 1.1
      learning_rate: 0.05
      max_depth: 8
      min_child_weight: 50
      reg_lambda: 1.0
      subsample: 0.85
      colsample_bytree: 0.85
      tree_method: hist
    xgboost_rounds: 590     # 532 best iteration + ~10% margin
  n_estimators: 1160        # LightGBM member: fixed round count (1,059 best iteration from early stopping + ~10% margin)
  params:
    objective: tweedie      # zero-inflated, right-skewed counts (see docs/ARCHITECTURE.md)
    tweedie_variance_power: 1.05
    metric: tweedie
    learning_rate: 0.05
    num_leaves: 127
    min_data_in_leaf: 200
    lambda_l2: 1.0
    feature_fraction: 0.85
    bagging_fraction: 0.85
    bagging_freq: 1
    verbose: -1

interpretability:
  permutation_rows: 15000
  permutation_repeats: 3
  shap_rows: 10000
