# Demo configuration: trains on the SYNTHETIC dataset (data/synthetic/, generated by
# scripts/make_synthetic_data.py) and writes to artifacts/demo/. The committed demo bundle in
# artifacts/demo/ was produced with exactly this file. Metrics from it are demonstration values.
seed: 42

paths:
  raw_dir: data/synthetic
  artifact_dir: artifacts/demo

data:
  label: synthetic-demo

forecast:
  horizon_days: 42
  origin_stride_days: 7
  min_history_days: 28

validation:
  n_windows: 3

model:
  n_estimators: 300
  params:
    learning_rate: 0.08
    num_leaves: 31
    min_data_in_leaf: 100

interpretability:
  permutation_rows: 6000
  permutation_repeats: 2
  shap_rows: 4000
